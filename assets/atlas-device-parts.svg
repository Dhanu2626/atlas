<svg width="1200" height="520" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">ATLAS device: what each part does</title><desc id="d">The three LEDs, two buttons, the serial monitor and the simulated GNSS receiver of the ATLAS device, with the GPIO each uses and what it means.</desc>
<defs><filter id="gl3" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6"/></filter></defs>
<rect x="0" y="0" width="1200" height="520" fill="#0A0B0D"/>
<rect x="30" y="26" width="365" height="158" rx="10" fill="#111318" stroke="#1F2937"/>
<circle cx="70" cy="76" r="18" fill="#22C55E" opacity=".7" filter="url(#gl3)"/><circle cx="70" cy="76" r="13" fill="#22C55E"/>
<text x="104" y="66" font-family="JetBrains Mono, Cascadia Mono, Consolas, Menlo, monospace" font-size="11" fill="#3B82F6" text-anchor="start" font-weight="700" letter-spacing="1">D1 · GPIO25</text>
<text x="104" y="90" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#FFFFFF" text-anchor="start" font-weight="700">Green · ALLOW</text>
<text x="54" y="134" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#9CA3AF" text-anchor="start">The only green path:</text>
<text x="54" y="154" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#9CA3AF" text-anchor="start">the payment was approved.</text>
<rect x="415" y="26" width="365" height="158" rx="10" fill="#111318" stroke="#1F2937"/>
<circle cx="455" cy="76" r="18" fill="#F59E0B" opacity=".7" filter="url(#gl3)"/><circle cx="455" cy="76" r="13" fill="#F59E0B"/>
<text x="489" y="66" font-family="JetBrains Mono, Cascadia Mono, Consolas, Menlo, monospace" font-size="11" fill="#3B82F6" text-anchor="start" font-weight="700" letter-spacing="1">D2 · GPIO26</text>
<text x="489" y="90" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#FFFFFF" text-anchor="start" font-weight="700">Amber · Attention</text>
<text x="439" y="134" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#9CA3AF" text-anchor="start">STEP_UP, DELAY or PENDING.</text>
<text x="439" y="154" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#9CA3AF" text-anchor="start">Blinks 1–3× when SELECT picks.</text>
<rect x="800" y="26" width="365" height="158" rx="10" fill="#111318" stroke="#1F2937"/>
<circle cx="840" cy="76" r="18" fill="#EF4444" opacity=".7" filter="url(#gl3)"/><circle cx="840" cy="76" r="13" fill="#EF4444"/>
<text x="874" y="66" font-family="JetBrains Mono, Cascadia Mono, Consolas, Menlo, monospace" font-size="11" fill="#3B82F6" text-anchor="start" font-weight="700" letter-spacing="1">D3 · GPIO27</text>
<text x="874" y="90" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#FFFFFF" text-anchor="start" font-weight="700">Red · DENY / FAIL-CLOSED</text>
<text x="824" y="134" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#9CA3AF" text-anchor="start">Refused, failed closed, or any</text>
<text x="824" y="154" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#9CA3AF" text-anchor="start">unrecognised reply (e.g. no clock).</text>
<rect x="30" y="202" width="365" height="158" rx="10" fill="#111318" stroke="#1F2937"/>
<rect x="52" y="234" width="36" height="36" rx="5" fill="#1F2937" stroke="#4B5563"/><circle cx="70" cy="252" r="11" fill="#3B82F6"/>
<text x="104" y="242" font-family="JetBrains Mono, Cascadia Mono, Consolas, Menlo, monospace" font-size="11" fill="#3B82F6" text-anchor="start" font-weight="700" letter-spacing="1">SW1 · GPIO14</text>
<text x="104" y="266" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#FFFFFF" text-anchor="start" font-weight="700">SELECT</text>
<text x="54" y="310" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#9CA3AF" text-anchor="start">Cycles 3 presets: ₹1,500 ALLOW,</text>
<text x="54" y="330" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#9CA3AF" text-anchor="start">₹60,000 STEP_UP, ₹1,50,000 DENY.</text>
<rect x="415" y="202" width="365" height="158" rx="10" fill="#111318" stroke="#1F2937"/>
<rect x="437" y="234" width="36" height="36" rx="5" fill="#1F2937" stroke="#4B5563"/><circle cx="455" cy="252" r="11" fill="#22C55E"/>
<text x="489" y="242" font-family="JetBrains Mono, Cascadia Mono, Consolas, Menlo, monospace" font-size="11" fill="#3B82F6" text-anchor="start" font-weight="700" letter-spacing="1">SW2 · GPIO12</text>
<text x="489" y="266" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#FFFFFF" text-anchor="start" font-weight="700">SEND</text>
<text x="439" y="310" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#9CA3AF" text-anchor="start">Signs the selected payment</text>
<text x="439" y="330" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#9CA3AF" text-anchor="start">(Ed25519) and sends it to ATLAS.</text>
<rect x="800" y="202" width="365" height="158" rx="10" fill="#111318" stroke="#1F2937"/>
<rect x="820" y="237" width="40" height="30" rx="4" fill="#1F2937" stroke="#4B5563"/>
<text x="840" y="257" font-family="JetBrains Mono, Cascadia Mono, Consolas, Menlo, monospace" font-size="13" fill="#E5E7EB" text-anchor="middle" font-weight="700">&gt;_</text>
<text x="874" y="242" font-family="JetBrains Mono, Cascadia Mono, Consolas, Menlo, monospace" font-size="11" fill="#3B82F6" text-anchor="start" font-weight="700" letter-spacing="1">TX0 / RX0 · GPIO1 / 3</text>
<text x="874" y="266" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#FFFFFF" text-anchor="start" font-weight="700">Serial monitor</text>
<text x="824" y="310" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#9CA3AF" text-anchor="start">115200 baud. Prints the decision</text>
<text x="824" y="330" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#9CA3AF" text-anchor="start">trace; carries no control.</text>
<rect x="30" y="378" width="1135" height="120" rx="10" fill="#111318" stroke="#F97316" stroke-dasharray="6 4"/>
<rect x="50" y="408" width="40" height="40" rx="4" fill="#1F2937" stroke="#F97316"/>
<text x="70" y="433" font-family="JetBrains Mono, Cascadia Mono, Consolas, Menlo, monospace" font-size="10" fill="#F97316" text-anchor="middle" font-weight="700">GNSS</text>
<text x="104" y="418" font-family="JetBrains Mono, Cascadia Mono, Consolas, Menlo, monospace" font-size="11" fill="#3B82F6" text-anchor="start" font-weight="700" letter-spacing="1">U2 · UART2 · GPIO16 / 17</text>
<text x="104" y="442" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#FFFFFF" text-anchor="start" font-weight="700">GNSS receiver · SIMULATED</text>
<text x="104" y="468" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#9CA3AF" text-anchor="start">NMEA at 9600 baud. The device checks each sentence and signs its reading as location evidence; ATLAS grades it.</text>
<text x="104" y="486" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#9CA3AF" text-anchor="start">In Wokwi it is a custom chip with scripted positions: no satellite is received.</text>
</svg>
