# Example policy, written in the frozen Policy Semantic Layer vocabulary
# (MAX_AMOUNT / NEW_BENEFICIARY / INTERNATIONAL / TIME_WINDOW / VELOCITY /
# RISK_THRESHOLD, and since version 5 BEYOND_OBSERVED_RANGE). Rules are evaluated independently; if more than one matches,
# the most restrictive action wins (DENY > DELAY > STEP_UP > ALLOW) — see
# atlas_service/policy/engine.py's module docstring for why that ordering, not
# the freeze conversation, decided this.
version: 5
subject: user-demo-1

# Timezone the TIME_WINDOW rules below are expressed in (IANA name).
# Added at version 4, 2026-08-26. Before this, TIME_WINDOW read the raw hour
# of whatever offset the client sent -- and the ESP32 sends UTC, so
# `odd_hours` fired at 09:24 IST and stayed silent at 21:00 IST. A window
# like [22, 6] is a statement about the user's own day, so it is evaluated
# in the user's timezone. Omit this field and the previous behaviour applies
# unchanged (see engine.policy_hour).
timezone: Asia/Kolkata

rules:
  - name: hard_cap
    condition:
      MAX_AMOUNT: 100000
    action: DENY

  - name: large_amount
    condition:
      MAX_AMOUNT: 50000
    action: STEP_UP

  - name: new_beneficiary_meaningful_amount
    condition:
      NEW_BENEFICIARY: true
      MAX_AMOUNT: 20000
    action: STEP_UP

  - name: international_txn
    condition:
      INTERNATIONAL: true
    action: STEP_UP

  - name: high_ml_risk
    condition:
      RISK_THRESHOLD: HIGH
    action: STEP_UP

  - name: velocity_burst
    condition:
      VELOCITY: 20
    action: DENY

  - name: odd_hours
    condition:
      TIME_WINDOW: [22, 6]
    action: STEP_UP

  # Version 5, 2026-09-29. A burst of payments far beyond this customer's own
  # history -- more in 24 hours than 6x their busiest earlier 24 hours -- asks the
  # customer to confirm. velocity_burst above still refuses more than 20 outright;
  # this catches the smaller, relative bursts it cannot. Only customers ATLAS has
  # seen 200+ payments from carry this evidence.
  - name: burst_beyond_own_history
    condition:
      BEYOND_OBSERVED_RANGE: true
    action: STEP_UP
