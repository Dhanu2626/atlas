<style>
  :root {
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);

    --bg: #f5f6f8;
    --panel: #ffffff;
    --ink: #14161a;
    --muted: #616570;
    --line: #e2e5ea;
    --accent: #2457d6;

    --allow-bg: #e7f4ea; --allow-fg: #1d6b33;
    --step-bg:  #fdf1dd; --step-fg:  #8a5008;
    --deny-bg:  #fceaea; --deny-fg:  #9d2727;
    --info-bg:  #e9eef9; --info-fg:  #24479d;
    --null-bg:  #eceef1; --null-fg:  #5c616b;

    --radius: 12px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1013;
      --panel: #171a1f;
      --ink: #e9ebef;
      --muted: #9aa0ab;
      --line: #272b32;
      --accent: #7ba1ff;

      --allow-bg: #16301f; --allow-fg: #7fd398;
      --step-bg:  #33260f; --step-fg:  #eab765;
      --deny-bg:  #351a1a; --deny-fg:  #f08d8d;
      --info-bg:  #1a2440; --info-fg:  #93b3fb;
      --null-bg:  #23262c; --null-fg:  #9aa0ab;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 100%/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
  }

  .shell { max-width: 1120px; margin: 0 auto; padding: 0 20px; }

  /* Translucent chrome with content scrolling under it, and a soft scroll
     edge instead of a hard 1px rule. */
  header.top {
    position: sticky;
    top: 0;
    z-index: 10;
    padding-top: env(safe-area-inset-top, 0px);
    background: color-mix(in srgb, var(--bg) 78%, transparent);
    -webkit-backdrop-filter: blur(14px) saturate(1.5);
    backdrop-filter: blur(14px) saturate(1.5);
    box-shadow: 0 8px 16px -16px rgba(0,0,0,.6);
  }
  /* padding-block, not the padding shorthand: .top-inner shares its element
     with .shell, and "padding: 14px 0" silently zeroed the 20px side gutter. */
  .top-inner { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding-block: 14px; }
  .wordmark { font-size: 19px; font-weight: 650; letter-spacing: -0.01em; }
  .wordmark span { color: var(--accent); }
  .top-note { font-size: 13px; color: var(--muted); }

  .banner {
    display: flex; gap: 10px; align-items: flex-start;
    background: var(--info-bg); color: var(--info-fg);
    border-radius: var(--radius);
    padding: 12px 14px; margin: 16px 0 6px;
    font-size: 13.5px; line-height: 1.5;
  }
  .banner b { font-weight: 640; }
  .banner.warn { background: var(--deny-bg); color: var(--deny-fg); }
  .banner svg { flex: none; width: 18px; height: 18px; margin-top: 1px; }
  .banner ul { margin: 6px 0 0; padding-left: 18px; }

  h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--muted); font-weight: 620; margin: 30px 0 10px;
  }
  h3 { font-size: 15px; margin: 0 0 8px; font-weight: 620; letter-spacing: -0.005em; }

  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px;
  }

  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 12px; }
  .metric { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .metric .k { font-size: 12.5px; color: var(--muted); }
  .metric .v {
    font-size: 30px; font-weight: 640;
    line-height: 1.1; letter-spacing: -0.025em;   /* large text: negative tracking */
    font-variant-numeric: tabular-nums;
  }
  .metric .sub { font-size: 12px; color: var(--muted); }

  .split { display: grid; grid-template-columns: minmax(0, 330px) minmax(0, 1fr); gap: 14px; align-items: start; }
  @media (max-width: 860px) { .split { grid-template-columns: 1fr; } }

  .scn { display: flex; flex-direction: column; gap: 6px; }
  .scn button {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: var(--panel); color: inherit;
    border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 13px; font: inherit;
    transition: transform 140ms var(--ease-out), border-color 140ms var(--ease-out);
  }
  .scn button:active { transform: scale(0.985); }
  .scn button[aria-current="true"] { border-color: var(--accent); }
  .scn button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (hover: hover) and (pointer: fine) {
    .scn button:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
  }
  .scn .row1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .scn .amt { font-weight: 620; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .scn .meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

  .pill {
    display: inline-block; font-size: 12px; font-weight: 620;
    padding: 3px 9px; border-radius: 999px; white-space: nowrap;
    letter-spacing: 0.02em;                        /* small text: positive tracking */
  }
  .pill.ALLOW { background: var(--allow-bg); color: var(--allow-fg); }
  .pill.STEP_UP { background: var(--step-bg); color: var(--step-fg); }
  .pill.DENY, .pill.FAIL_CLOSED { background: var(--deny-bg); color: var(--deny-fg); }
  .pill.PENDING, .pill.DELAY { background: var(--info-bg); color: var(--info-fg); }
  .pill.none { background: var(--null-bg); color: var(--null-fg); }

  .stage { display: grid; gap: 12px; }
  .stage .lane { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }

  dl.kv { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; font-size: 13.5px; }
  dl.kv dt { color: var(--muted); }
  dl.kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }

  /* overflow-wrap, because these lines carry recorded sources: file paths,
     test ids and board names are single unbreakable tokens, and one of them
     (a pytest node id) pushed the whole page 7px wide at 400px on 2026-09-18. */
  ul.reasons { margin: 8px 0 0; padding-left: 18px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  ul.reasons li { margin: 2px 0; }

  .rules { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .rules .r { font-size: 12px; padding: 3px 8px; border-radius: 6px; background: var(--null-bg); color: var(--null-fg); }
  .rules .r.win { background: var(--step-bg); color: var(--step-fg); font-weight: 620; }

  .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }

  .bar { height: 7px; border-radius: 999px; background: var(--null-bg); overflow: hidden; margin-top: 8px; }
  .bar > i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }

  .notproven { font-size: 13.5px; color: var(--muted); }
  .notproven li { margin: 5px 0; }

  footer { color: var(--muted); font-size: 12.5px; padding: 26px 0 40px; }
  footer a { color: var(--accent); }

  /* Decorative first-paint stagger. Occasional (a page load), short, and it
     never blocks interaction. */
  .fade { opacity: 0; transform: translateY(6px); animation: rise 320ms var(--ease-out) forwards; }
  .fade:nth-of-type(2) { animation-delay: 40ms; }
  .fade:nth-of-type(3) { animation-delay: 80ms; }
  .fade:nth-of-type(4) { animation-delay: 120ms; }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }

  @media (prefers-reduced-motion: reduce) {
    .fade { animation: fadeonly 200ms ease forwards; transform: none; }
    @keyframes fadeonly { to { opacity: 1; } }
    .scn button { transition: border-color 140ms ease; }
    .scn button:active { transform: none; }
  }
  @media (prefers-reduced-transparency: reduce) {
    header.top { background: var(--bg); backdrop-filter: none; -webkit-backdrop-filter: none; }
  }

  /* ---- Try the device (2026-09-29): the ESP32's two buttons and three LEDs ---- */
  .device { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 720px) { .device { grid-template-columns: minmax(0, 1fr); } }
  .board {

    border: 1px solid #0b241c; box-shadow: inset 0 0 0 3px #184536;

  .board .chip { font: 600 12px/1.3 ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: .06em;
    color: #b9d8cb; margin-bottom: 10px; }
  .board .screen { background: #0a1f18; border-radius: 8px; padding: 10px 12px; min-height: 64px;
    font: 13px/1.45 ui-monospace, "Cascadia Mono", Consolas, monospace; color: #d7f5e7; }
  .board .leds { display: flex; gap: 18px; margin: 14px 2px; }
  .board .led { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: #b9d8cb; }
  .board .led i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #0b241c; opacity: .28;
    transition: opacity 160ms ease, box-shadow 160ms ease; }
  .board .led.g i { background: #3ddc6f; } .board .led.a i { background: #ffb020; } .board .led.r i { background: #ff4d4d; }
  .board .led[data-on="true"] i { opacity: 1; box-shadow: 0 0 14px 3px currentColor; }
  .board .led.g[data-on="true"] i { color: #3ddc6f; } .board .led.a[data-on="true"] i { color: #ffb020; }
  .board .led.r[data-on="true"] i { color: #ff4d4d; }
  .board .keys { display: flex; gap: 10px; flex-wrap: wrap; }
  .board button {
    font: 600 13px/1 system-ui, sans-serif; letter-spacing: .04em; padding: 11px 14px; min-height: 44px;
    border-radius: 999px; border: 1px solid #0b241c; background: #e6f2ec; color: #12352a; cursor: pointer;
  }
  .board button:active { transform: scale(0.97); }
  .board button:focus-visible { outline: 2px solid #ffb020; outline-offset: 2px; }
  .board button.time { background: transparent; color: #e6f2ec; border-color: #3f6b5b; }
  .devout .next { margin-top: 10px; }
  .devout .next button { font: inherit; color: var(--accent); background: none; border: 0; padding: 0;
    cursor: pointer; text-decoration: underline; }
  @media (prefers-reduced-motion: reduce) {
    .board .led i { transition: none; }
    .board button:active { transform: none; }
  }

  function auc(n) {

  var dv = s.devices;
  if (dv) {
    html += '<section class="fade"><h2>Device registry</h2><div class="grid3">';
    html += '<div class="panel"><h3>Standing</h3><dl class="kv">' +
      kv("Registered", num(dv.total)) +
      kv("Active", num((dv.by_status || {}).ACTIVE || 0)) +
      kv("Revoked", num((dv.by_status || {}).REVOKED || 0)) +
      "</dl></div>";
    html += '<div class="panel"><h3>Provisioning</h3><dl class="kv">' +
      Object.keys(dv.by_provisioning_mode || {}).map(function (k) {
        return kv(k, num(dv.by_provisioning_mode[k]));
      }).join("") +
      kv("With secure element", num(dv.with_secure_element)) +
      "</dl></div>";
    html += '<div class="panel"><h3>Firmware seen</h3><dl class="kv">' +
      kv("Versions", (dv.firmware_versions || []).map(esc).join(", ") || "—") +
      "</dl><ul class=\"reasons\"><li>Keys live in plaintext flash. A valid signature proves possession of a key, not that a device is genuine.</li></ul></div>";
    html += "</div></section>";
  }

  /* ---- measurements ---- */
  var fw = m.firmware || {};
  /* Every recorded mutation set, totalled: a set that is added but not shown would
     quietly stop counting. Each set keeps its own source line. */
  var mutSets = m.mutation_checks || {};
  var mut = { introduced: 0, caught: 0, sources: [] };
  Object.keys(mutSets).forEach(function (name) {
    var set = mutSets[name] || {};
    if (typeof set.introduced === "number") { mut.introduced += set.introduced; }
    if (typeof set.caught === "number") { mut.caught += set.caught; }
    if (set.source) { mut.sources.push(set.source); }
  });
  html += '<section class="fade"><h2>Measurements</h2><div class="grid3">';
  html += '<div class="panel"><h3>Test suite</h3><dl class="kv">' +
    kv(testsRan && tests.failed ? "Passed" : "Passing", num(tests.total)) +
    (testsRan ? kv("Result", tests.failed
      ? '<span class="pill DENY">did not pass</span>'
      : '<span class="pill ALLOW">all passed</span>') : "") +
    kv("Method", esc(tests.method || "—")) +
    "</dl></div>";
  html += '<div class="panel"><h3>Firmware</h3><dl class="kv">' +
    kv("Build size", plain(fw.build_bytes) + " B") +
    kv("Flash used", num(fw.flash_percent) + "%") +
    kv("Canonical bytes", plain(fw.canonical_envelope_bytes)) +
    kv("Parity tests", num(fw.parity_tests)) +
    "</dl><ul class=\"reasons\"><li>" + esc(fw.note || "") + "</li>" + source(fw.source) + "</ul></div>";
  html += '<div class="panel"><h3>Mutation checks</h3><dl class="kv">' +
    kv("Breaks introduced", num(mut.introduced)) +
    kv("Caught by a test", num(mut.caught)) +
    "</dl>" + bar(mut.caught, mut.introduced) +
    (mut.sources.length
      ? '<ul class="reasons">' + mut.sources.map(source).join("") + "</ul>"
      : "") + "</div>";
  /* Measured since 2026-09-18 (scripts/evaluate_ml.py), and the caveat travels
     with the number: both classes come from the same synthetic generator, so
     this is separation on generated data, not fraud detection. */
  var mlq = m.ml || {};
  var headline = mlq.at_medium_and_above;
  html += '<div class="panel"><h3>ML quality</h3><dl class="kv">' +
    (headline
      ? kv("Precision", num(headline.precision)) + kv("Recall", num(headline.recall)) +
        kv("F1", num(headline.f1)) +
        kv("False positives", plain(headline.false_positives) + " of " + plain(headline.ordinary)) +
        kv("Score latency", mlq.latency ? plain(Math.round(mlq.latency.score_ms_median)) + " ms median" : "—")
      : kv("Precision / recall", '<span class="pill none">' +
          esc(mlq.method === "did not run in this export" ? "evaluation failed" : "not run in this export") +
          "</span>")) +
    "</dl><ul class=\"reasons\">" +
    (headline
      ? "<li>Flagged means MEDIUM or HIGH, against " + plain(headline.planted) +
        " planted anomalies and " + plain(headline.ordinary) + " unseen ordinary transactions.</li>" +
        "<li>Synthetic on both sides, from the same generator: separation on generated data, <b>not</b> fraud detection.</li>" +
        "<li>Counting the deliberately legitimate large purchase as ordinary instead gives precision " +
        num((mlq.at_medium_and_above_excluding_the_legitimate_large_purchase || {}).precision) + ".</li>" +
        "<li>Source: measured by this export with <code>scripts/evaluate_ml.py</code>.</li>"
      : "<li>The model produces evidence; a policy rule decides. Run the export with <code>--run-tests</code> to measure this.</li>") +
    "</ul></div>";

  /* Held-out evaluation (2026-09-22): held-out personas, disjoint test seeds,
     an independent anomaly generator. Still synthetic, and said so. */
  var held = (mlq.held_out || {}).test;
  if (held) {
    var hm = held.at_medium_and_above || {};
    html += '<div class="panel"><h3>ML, held-out test</h3><dl class="kv">' +
      kv("ROC-AUC", auc(held.roc_auc)) + kv("Precision", num(hm.precision)) +
      kv("Recall", num(hm.recall)) +
      kv("False positives", plain((hm.confusion_matrix || {}).fp) + " of " + plain(held.negatives)) +
      "</dl><ul class=\"reasons\">" +
      "<li>" + plain(held.cases) + " cases from four held-out personas and test seeds disjoint from training; anomalies from an independent generator.</li>" +
      "<li>Still synthetic: separation of specified deviations, <b>not</b> fraud detection. The Isolation Forest itself catches bursts of payments " +
      num((held.recall_by_family || {}).burst) + " of the time.</li>" +
      rangeLine((mlq.held_out || {}).beyond_observed_range) +
      "<li>Source: measured by this export with <code>atlas_service/ml/evaluation.py</code>.</li></ul></div>";
  }

  /* The separate burst signal (2026-09-25): reported beside the forest, never as
     the forest's own result, and never as a decision. */
  function rangeLine(sig) {
    if (!sig || !sig.test) return "";
    var t = sig.test;
    return "<li>A <b>separate</b> evidence signal, <code>beyond_observed_range</code> (not the Isolation Forest), flagged " +
      plain(Math.round((t.burst_recall || 0) * (t.bursts || 0))) + " of " + plain(t.bursts) + " held-out bursts and " +
      plain(t.fired_on_negatives) + " of " + plain(t.negatives) + " ordinary payments. Its multiplier (" +
      plain(sig.selected_multiplier) + "×) was chosen on the validation split only. It is evidence only: it changes no risk band and no decision.</li>";
  }

  /* Public benchmark: recorded, and explicitly not a measurement of ATLAS. */
  var pub = m.ml_public_benchmark || {};
  if (pub.method === "recorded") {
    var ph = pub.at_high_only || {};
    html += '<div class="panel"><h3>Public benchmark</h3><dl class="kv">' +
      kv("ROC-AUC", auc(pub.roc_auc)) + kv("Avg precision", auc(pub.average_precision)) +
      kv("At HIGH: recall", num(ph.recall)) + kv("At HIGH: precision", num(ph.precision)) +
      "</dl><ul class=\"reasons\">" +
      "<li>" + esc(pub.dataset) + ", " + plain(pub.rows) + " real anonymised card transactions, " + plain(pub.frauds) + " fraud.</li>" +
      "<li>Benchmarks the detector's <b>configuration</b> on anonymised PCA features. It is <b>not</b> ATLAS's per-customer model, which this data cannot feed.</li>" +
      source(pub.source) + "</ul></div>";
  }
  html += "</div></section>";

  /* ---- limits ---- */
  html += '<section class="fade"><h2>What this does not prove</h2><div class="panel"><ul class="notproven">' +
    "<li>Scope boundary, by design: no hardware security property. ATLAS is a software-only prototype; the firmware has only ever run in the Wokwi simulator, never on a physical ESP32.</li>" +
    "<li>ML precision and recall are measured against synthetic data from the same generator that trained the model — separation on generated data, never evidence of fraud detection. The public benchmark tests the detector's configuration, not ATLAS.</li>" +
    "<li>The velocity and new-payee checks read each customer's own persisted payments, so a live burst is refused by the <code>velocity_burst</code> rule. The ML layer judges no customer with fewer than 200 payments on record: it answers INSUFFICIENT_HISTORY, which is not LOW and matches no risk rule. The Isolation Forest itself does not catch bursts (held-out recall 0.0); a separate <code>beyond_observed_range</code> signal flags synthetic bursts on held-out personas, but it is evidence only — no policy rule reads it.</li>" +
    "<li>Novelty is explicitly unproven — prior art (US20210065194A1) covers most of the original architecture.</li>" +
    "<li>Step-up ships off by default. Its approve path has been observed in the Wokwi simulator, never on physical hardware.</li>" +
    "<li>No production TLS. ATLAS reaches the bank over mutual TLS from a local test CA. An opt-in production profile adds TLS 1.3 only, revocation checks against a CRL and a pinned bank key, all tested locally — but the CA, its CRL and the pin are local (external requirement: a public or enterprise PKI and an HSM), and the Wokwi device reaches ATLAS unencrypted through a local gateway, so it runs only in the development profile.</li>" +
    "<li>No hardware key protection. ATLAS's keys on disk are encrypted at rest, but any process running as the same user can decrypt them, and the device's own seed is plaintext in flash.</li>" +
    "</ul></div></section>";

  app.innerHTML = html;

  /* ---- scenario selection ---- */
  function detail(r) {
    var p = r.policy || {}, ml = r.ml || {}, c = r.crypto || {}, b = r.bank || {};
    var rp = r.replay || {};
    var h = '<div class="stage">';

    h += '<div class="panel"><h3>' + esc(r.label) + "</h3><dl class=\"kv\">" +
      kv("Amount", inr(r.amount)) + kv("Local time", esc(r.local_time)) +
      kv("Rail", esc(r.rail)) + kv("Outcome", pill(r.final_status)) +
      kv("Reason", "<code>" + esc(r.decision_reason) + "</code>") + "</dl></div>";

    h += '<div class="lane">';

    h += '<div class="panel"><h3>1 · ML evidence</h3><dl class="kv">' +
      kv("Risk band", esc(ml.risk_band) + (ml.risk_band === "INSUFFICIENT_HISTORY" ? " — not judged, not LOW" : "")) +
      kv("Anomaly score", ml.anomaly_score === null || ml.anomaly_score === undefined ? "not scored" : ml.anomaly_score) +
      kv("Burst evidence", !ml.range_signal ? "not evaluated (the ML layer did not operate)"
        : (ml.range_signal.fired ? "<b>beyond_observed_range FIRED</b>" : "beyond_observed_range not fired") +
          " — " + plain(ml.range_signal.current_24h) + " payments in 24 h; busiest earlier 24 h " +
          (ml.range_signal.observed_max_24h === null ? "unknown" : plain(ml.range_signal.observed_max_24h)) +
          "; evidence only, no decision effect") +
      "</dl>" +
      ((ml.reasons || []).length
        ? '<ul class="reasons">' + ml.reasons.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>"
        : "") +
      '<ul class="reasons"><li><b>Advisory only.</b> Never decides.</li></ul></div>';

    h += '<div class="panel"><h3>2 · Policy decision</h3><dl class="kv">' +
      kv("Decision", pill(p.decision)) +
      kv("Deciding rule", p.deciding_rule ? "<code>" + esc(p.deciding_rule) + "</code>" : "none fired") +
      kv("Policy version", "v" + esc(p.version)) +
      kv("Policy hash", "<code>" + esc(p.hash_prefix) + "…</code>") +
      "</dl>" +
      ((p.matched_rules || []).length
        ? '<div class="rules">' + p.matched_rules.map(function (x) {
            return '<span class="r' + (x === p.deciding_rule ? " win" : "") + '">' + esc(x) + "</span>";
          }).join("") + "</div>"
        : '<ul class="reasons"><li>No rule matched.</li></ul>');
    h += "</div>";

    h += '<div class="panel"><h3>3 · Signing</h3><dl class="kv">' +
      kv("Assertion signed", c.assertion_signed
        ? '<span class="pill ALLOW">signed</span>'
        : '<span class="pill none">not signed</span>') +
      (c.assertion_signed ? kv("Ed25519 signature", num(c.signature_hex_len) + " hex chars") : "") +
      (c.assertion_signed ? kv("Replay nonce", c.nonce_present ? "present" : "absent") : "") +
      (c.key_id ? kv("Key id", "<code>" + esc(c.key_id) + "</code>") : "") +
      "</dl>" +
      (c.assertion_signed
        ? ""
        : '<ul class="reasons"><li>Only an ALLOW is ever signed — nothing else has anything to assert.</li></ul>') +
      "</div>";

    h += '<div class="panel"><h3>4 · Bank</h3><dl class="kv">' +
      kv("Contacted", b.contacted ? "yes" : "no") +
      (b.contacted ? kv("Verdict", b.approved
        ? '<span class="pill ALLOW">approved</span>'
        : '<span class="pill DENY">refused</span>') : "") +
      (b.reason ? kv("Reason", esc(b.reason)) : "") +
      "</dl>" +
      (b.contacted
        ? '<ul class="reasons"><li>The bank decides independently and may overrule ATLAS toward refusal.</li></ul>'
        : '<ul class="reasons"><li>ATLAS refused first, so the bank was never contacted.</li></ul>') +
      "</div>";

    h += '<div class="panel"><h3>5 · Replay defence</h3><dl class="kv">' +
      kv("Same envelope sent twice", rp.final_status
        ? (rp.refused ? '<span class="pill ALLOW">refused</span>'
                      : '<span class="pill DENY">accepted again</span>')
        : '<span class="pill none">not tested</span>') +
      (rp.decision_reason ? kv("Refused by", "<code>" + esc(rp.decision_reason) + "</code>") : "") +
      (typeof r.elapsed_ms === "number" ? kv("Round trip", plain(Math.round(r.elapsed_ms)) + " ms") : "") +
      "</dl><ul class=\"reasons\">" +
      "<li>The export sends each signed envelope a second time. Three defences could stop it — the device counter, the nonce and the transaction id — and the first to answer is the one named here.</li>" +
      (typeof r.elapsed_ms === "number"
        ? "<li>Round trip covers envelope verification, ML inference with the pre-trained model, the policy decision, signing and the bank. The model is trained once, never per request.</li>" : "") +
      "</ul></div>";

    h += "</div>";

    if ((r.rail_payload_fields || []).length) {
      h += '<div class="panel"><h3>Rail payload · ' + esc(r.rail) + "</h3>" +
        '<div class="rules">' + r.rail_payload_fields.map(function (f) {
          return '<span class="r">' + esc(f) + "</span>";
        }).join("") + "</div>" +
        '<ul class="reasons"><li>The adapter frames the signed assertion and never edits through it.</li></ul></div>';
    }

    return h + "</div>";
  }

  var buttons = Array.prototype.slice.call(document.querySelectorAll("#scn button"));
  var pane = document.getElementById("detail");
  function select(i) {
    buttons.forEach(function (b, j) { b.setAttribute("aria-current", String(j === i)); });
    /* Content swap is instant on purpose: this is a frequent action, and an
       animation here would only add latency between intent and answer. */
    pane.innerHTML = detail(rows[i]);
  }
  buttons.forEach(function (b, i) { b.addEventListener("click", function () { select(i); }); });
  if (rows.length) select(0);

  /* ---- the device: SELECT cycles the presets, SEND lights the LED ---- */
  var DAY = "10:00 IST", NIGHT = "23:30 IST";
  var devIndex = 0, devNight = false;
  if (DEVICE_PRESETS.length) {
    document.getElementById("dev-select").addEventListener("click", function () {
      devIndex = (devIndex + 1) % DEVICE_PRESETS.length;
      devReady();
    });
    document.getElementById("dev-time").addEventListener("click", function () {
      devNight = !devNight;
      var t = document.getElementById("dev-time");
      t.textContent = "Time: " + (devNight ? NIGHT : DAY);
      t.setAttribute("aria-pressed", String(devNight));
      devReady();
    });
    document.getElementById("dev-send").addEventListener("click", devSend);
    devReady();
  }

  function devicePresets(all) {
    /* The device's presets are the sweep's UPI payments, one per amount, in the
       order the export ran them; each carries its recorded result per time. */
    var out = [], seen = {};
    all.forEach(function (r) {
      if (r.rail !== "UPI") return;
      if (!seen[r.amount]) {
        seen[r.amount] = { amount: r.amount, isNew: !!r.beneficiary_is_new, byTime: {} };
        out.push(seen[r.amount]);
      }
      seen[r.amount].byTime[r.local_time] = r;
    });
    return out;
  }
  /* The firmware's LED whitelist: green only for an explicit ALLOW; anything
     it does not recognise -- including a missing record -- fails closed, red. */
  function ledFor(status) {
    if (status === "ALLOW") return "green";
    if (status === "STEP_UP" || status === "DELAY" || status === "PENDING") return "amber";
    return "red";
  }
  function devLeds(on) {
    ["green", "amber", "red"].forEach(function (c) {
      document.getElementById("led-" + c).setAttribute("data-on", String(c === on));
    });
  }
  function devPreset() { return DEVICE_PRESETS[devIndex]; }
  function devReady() {
    var p = devPreset();
    devLeds(null);
    document.getElementById("dev-screen").innerHTML =
      "Preset " + (devIndex + 1) + " of " + DEVICE_PRESETS.length + "<br>" +
      inr(p.amount) + " to " + (p.isNew ? "a new payee" : "a familiar payee") + "<br>" +
      "at " + esc(devNight ? NIGHT : DAY) + " · press SEND";
    document.getElementById("dev-out").innerHTML =
      "<p>Press <b>SELECT</b> to choose a payment, <b>Time</b> to switch day and night, then <b>SEND</b> " +
      "to ask ATLAS. Green means ALLOW, amber means the customer must confirm (STEP-UP), red means DENY.</p>";
  }
  function devSend() {
    var r = devPreset().byTime[devNight ? NIGHT : DAY];
    var status = r ? r.final_status : null;
    devLeds(ledFor(status));
    document.getElementById("dev-screen").innerHTML =
      "ATLAS: " + esc(status ? String(status).replace(/_/g, "-") : "NO ANSWER") + "<br>" +
      (status === "ALLOW" ? "Payment approved" : status === "DENY" ? "Payment refused"
        : status ? "Confirm it's you" : "Failing closed") + "<br>press SELECT for another";
    if (!r) {
      document.getElementById("dev-out").innerHTML =
        "<p>This export has no recorded result for that payment, so the device does what the firmware " +
        "does with anything it cannot trust: it fails closed and lights red.</p>";
      return;
    }
    var p = r.policy || {}, ml = r.ml || {}, b = r.bank || {};
    var why = p.deciding_rule
      ? "The customer's signed policy rule <code>" + esc(p.deciding_rule) + "</code> decided it" +
        ((p.matched_rules || []).length > 1 ? " (it also matched " + p.matched_rules.filter(function (x) {
          return x !== p.deciding_rule;
        }).map(function (x) { return "<code>" + esc(x) + "</code>"; }).join(", ") + "; the strictest wins)" : "") + "."
      : "No rule in the customer's signed policy objected.";
    var mlText = ml.risk_band === "INSUFFICIENT_HISTORY"
      ? "The ML layer had too little payment history to judge, so the rules decided alone."
      : "ML evidence: " + esc(ml.risk_band) + " (advice only — it never decides).";
    var bankText = b.contacted
      ? "ATLAS signed its decision and the bank verified the signature: " + (b.approved ? "approved." : "refused.")
      : "Nothing was sent to the bank — a payment leaves only after an ALLOW.";
    document.getElementById("dev-out").innerHTML =
      "<p>" + pill(status) + " " + inr(r.amount) + " at " + esc(r.local_time) + "</p>" +
      '<ul class="reasons"><li>' + why + "</li><li>" + mlText + "</li><li>" + bankText + "</li></ul>" +
      '<div class="next"><button type="button" id="dev-layers">See every layer of this payment ↓</button></div>';
    var i = rows.indexOf(r);
    document.getElementById("dev-layers").addEventListener("click", function () {
      if (i >= 0) select(i);
      var still = typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (pane && pane.scrollIntoView) pane.scrollIntoView({ behavior: still ? "auto" : "smooth", block: "start" });
    });
  }

  function metric(k, v, sub) {
    return '<div class="metric"><div class="k">' + esc(k) + '</div><div class="v">' + v +
      '</div><div class="sub">' + esc(sub || "") + "</div></div>";
  }
  function kv(k, v) { return "<dt>" + esc(k) + "</dt><dd>" + v + "</dd>"; }
  function qty(n) { return typeof n === "number" ? String(n) : "?"; }
  /* Recorded figures say where they come from, so they cannot be mistaken
     for numbers this export measured. */
  function source(s) { return s ? "<li>Source: " + esc(s) + "</li>" : ""; }
  /* Why a payment is still waiting matters more than the count. Without a
     live challenge it is settled to DENIED the next time atlas_service starts
     (resolve_stale_step_ups); only a live challenge waits on a person. */
  function awaitingNote(aw, total) {
    if (!total) return "none waiting";
    if (!aw) return "challenge status not exported";
    var settles = (aw.expired || 0) + (aw.no_challenge || 0) + (aw.consumed_not_advanced || 0);
    if (!settles) return "challenge still live · waiting on a person";
    if (aw.expired === total) return "challenge expired · denied at next service start";
    if (settles === total) return "no live challenge · denied at next service start";
    return (aw.live || 0) + " live · " + settles + " denied at next service start";
  }
  function bar(a, b) {
    if (typeof a !== "number" || typeof b !== "number" || !b) return "";
    return '<div class="bar"><i style="width:' + Math.round((a / b) * 100) + '%"></i></div>';
  }
})();
</script>
</body>
</html>
