<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ATLAS · Decision Dashboard</title>
<meta name="description" content="A dated snapshot of real ATLAS numbers: transaction states, ML evidence, policy decisions, signing and bank verification, and how to read them.">
<meta name="theme-color" content="#eef3fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#050914" media="(prefers-color-scheme: dark)">
<!-- An empty icon, so a hosted copy does not ask for /favicon.ico. The page is one
     self-contained file and asks a server for nothing; this keeps that true when
     it is served over HTTP rather than opened from disk. -->
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light dark;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Roboto, sans-serif;
    --font-display: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Roboto, sans-serif;
    --mono: ui-monospace, "Cascadia Code", "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
    --radius: 16px;

    /* light: a lit blueprint (the same system as the live page) */
    --bg: #eef3fb; --bg-2: #f9fbff;
    --glow-1: rgba(56, 189, 248, 0.24); --glow-2: rgba(99, 102, 241, 0.18); --glow-3: rgba(16, 185, 129, 0.16);
    --grid: rgba(30, 64, 175, 0.07); --lane: rgba(30, 64, 175, 0.09);
    --panel: rgba(255, 255, 255, 0.88); --panel-2: rgba(244, 247, 253, 0.92); --hover: rgba(36, 87, 214, 0.05);
    --line: rgba(15, 23, 42, 0.10); --line-strong: rgba(15, 23, 42, 0.20); --track: rgba(15, 23, 42, 0.08);
    --ink: #0b1220; --muted: #475569; --faint: #5b6b82;
    --accent: #2457d6; --accent-2: #0b7a6e;
    --accent-glow: rgba(36, 87, 214, 0.28); --accent-2-glow: rgba(11, 122, 110, 0.30);
    --btn-ink: #ffffff; --btn-a: #0b7a6e; --btn-b: #2457d6;
    --allow: #15803d; --allow-bg: #dcfce7; --allow-line: rgba(21, 128, 61, 0.30); --allow-glow: rgba(22, 163, 74, 0.30); --allow-mark: #16a34a;
    --step:  #a15c07; --step-bg:  #fef3c7; --step-line:  rgba(161, 92, 7, 0.30);  --step-glow:  rgba(217, 119, 6, 0.30);  --step-mark: #e09a0b;
    --deny:  #b42318; --deny-bg:  #fee4e2; --deny-line:  rgba(180, 35, 24, 0.30); --deny-glow:  rgba(220, 38, 38, 0.30); --deny-mark: #dc3b3b;
    --info:  #1d4ed8; --info-bg:  #e0eaff; --info-line:  rgba(29, 78, 216, 0.25);
    --null:  #5c6370; --null-bg:  #eceff4; --null-mark: #94a3b8;
    --shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 14px 36px -16px rgba(15, 23, 42, 0.22);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      /* dark: a lit night console, never flat black */
      --bg: #050914; --bg-2: #0c1530;
      --glow-1: rgba(34, 211, 238, 0.20); --glow-2: rgba(99, 102, 241, 0.26); --glow-3: rgba(16, 185, 129, 0.15);
      --grid: rgba(148, 163, 184, 0.075); --lane: rgba(148, 163, 184, 0.07);
      --panel: rgba(13, 20, 38, 0.88); --panel-2: rgba(22, 32, 58, 0.72); --hover: rgba(122, 162, 255, 0.07);
      --line: rgba(148, 163, 184, 0.16); --line-strong: rgba(148, 163, 184, 0.30); --track: rgba(148, 163, 184, 0.13);
      --ink: #e8eef9; --muted: #a3b2c9; --faint: #8796ae;
      --accent: #7aa2ff; --accent-2: #2dd4bf;
      --accent-glow: rgba(122, 162, 255, 0.45); --accent-2-glow: rgba(45, 212, 191, 0.45);
      --btn-ink: #04121a; --btn-a: #5eead4; --btn-b: #7aa2ff;
      --allow: #4ade80; --allow-bg: rgba(34, 197, 94, 0.13); --allow-line: rgba(74, 222, 128, 0.35); --allow-glow: rgba(74, 222, 128, 0.40); --allow-mark: #22c55e;
      --step:  #fbbf24; --step-bg:  rgba(245, 158, 11, 0.13); --step-line:  rgba(251, 191, 36, 0.35); --step-glow:  rgba(251, 191, 36, 0.40); --step-mark: #f5a524;
      --deny:  #f87171; --deny-bg:  rgba(239, 68, 68, 0.13); --deny-line:  rgba(248, 113, 113, 0.35); --deny-glow:  rgba(248, 113, 113, 0.40); --deny-mark: #ef5555;
      --info:  #93b4ff; --info-bg:  rgba(99, 132, 255, 0.13); --info-line:  rgba(147, 180, 255, 0.30);
      --null:  #9aa6b8; --null-bg:  rgba(148, 163, 184, 0.12); --null-mark: #64748b;
      --shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 24px 56px -24px rgba(0, 0, 0, 0.75);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-padding-top: 16px; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 15.5px/1.6 var(--font);
    -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  a { color: var(--accent); }
  code { font: 0.86em var(--mono); }
  b { font-weight: 650; }

  /* ---------- the sky: lit, slowly moving; light streaks only in the side margins ---------- */
  .sky { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    background: radial-gradient(1400px 800px at 50% -15%, var(--bg-2), var(--bg) 70%); }
  .aurora { position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%; will-change: transform; animation: drift 30s ease-in-out infinite alternate; }
  .aurora.a1 { top: -34vmax; left: -22vmax; background: radial-gradient(closest-side, var(--glow-1), transparent 72%); }
  .aurora.a2 { top: -28vmax; right: -26vmax; background: radial-gradient(closest-side, var(--glow-2), transparent 72%); animation-duration: 36s; animation-delay: -9s; }
  .aurora.a3 { bottom: -44vmax; left: 12vw; background: radial-gradient(closest-side, var(--glow-3), transparent 72%); animation-duration: 42s; animation-delay: -18s; }
  @keyframes drift { 0% { transform: translate3d(0, 0, 0) scale(1); } 50% { transform: translate3d(5vw, 4vh, 0) scale(1.07); } 100% { transform: translate3d(-4vw, 7vh, 0) scale(0.95); } }
  .gridlines { position: absolute; inset: 0; background-size: 46px 46px; background-position: center top;
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    -webkit-mask-image: radial-gradient(ellipse 90% 75% at 50% 18%, #000 25%, transparent 78%); mask-image: radial-gradient(ellipse 90% 75% at 50% 18%, #000 25%, transparent 78%); }
  .lanes { position: absolute; inset: 0;
    -webkit-mask-image: linear-gradient(90deg, #000 0, #000 9%, transparent 24%, transparent 76%, #000 91%, #000 100%);
    mask-image: linear-gradient(90deg, #000 0, #000 9%, transparent 24%, transparent 76%, #000 91%, #000 100%); }
  .lanes i { position: absolute; left: 0; width: 100%; height: 1px; top: var(--y); background: linear-gradient(90deg, transparent, var(--lane) 15%, var(--lane) 85%, transparent); }
  .lanes i::after { content: ""; position: absolute; left: 0; top: -2px; width: 90px; height: 5px; border-radius: 4px; background: linear-gradient(90deg, transparent, var(--c));
    box-shadow: 0 0 14px 1px var(--c); opacity: 0.75; animation: packet var(--d) linear infinite; animation-delay: var(--w); will-change: transform; }
  @keyframes packet { from { transform: translateX(-12vw); } to { transform: translateX(112vw); } }

  /* ---------- layout ---------- */
  .shell { position: relative; z-index: 1; max-width: 1240px; margin: 0 auto; padding: 0 20px; }
  @media (max-width: 560px) { .shell { padding: 0 16px; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
  section { margin-top: 36px; }
  .sec-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 6px 20px; flex-wrap: wrap; margin-bottom: 14px; }
  .sec-head h2 { font: 700 24px/1.2 var(--font-display); letter-spacing: -0.02em; margin: 0; }
  .sec-head p { margin: 0; font-size: 13.5px; color: var(--muted); max-width: 70ch; }
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; margin: 0 0 10px; font: 600 12px/1.2 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent-2); }
  .eyebrow .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-2); position: relative; }
  .eyebrow .pulse::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--accent-2); animation: ping 2s var(--ease-out) infinite; }
  @keyframes ping { from { transform: scale(1); opacity: 0.7; } to { transform: scale(3.2); opacity: 0; } }
  h3 { font: 650 16px/1.3 var(--font-display); letter-spacing: -0.01em; margin: 0 0 10px; }

  /* ---------- header ---------- */
  header.top { display: flex; align-items: center; gap: 12px; padding: 18px 0 4px; flex-wrap: wrap; }
  .wordmark { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; font: 750 21px/1 var(--font-display); letter-spacing: -0.02em; color: var(--ink); text-decoration: none; }
  .wordmark .logo { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: var(--btn-ink);
    background: linear-gradient(135deg, var(--btn-a), var(--btn-b)); box-shadow: 0 8px 22px -8px var(--accent-glow); }
  .wordmark .dot { color: var(--accent-2); }
  .snap { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px; font-size: 13px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); }
  .snap i { width: 8px; height: 8px; border-radius: 50%; background: var(--step-mark); flex: none; }
  nav.links { margin-left: auto; display: flex; gap: 4px; flex-wrap: wrap; }
  nav.links a { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border-radius: 10px; color: var(--muted); text-decoration: none; font-size: 14px; transition: color 0.2s, background 0.2s; }
  nav.links a:hover { color: var(--ink); background: var(--panel); }

  /* ---------- hero ---------- */
  .hero { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr); gap: 28px; align-items: center; margin-top: 18px; }
  @media (max-width: 960px) { .hero { grid-template-columns: minmax(0, 1fr); } }
  h1 { font: 750 clamp(30px, 4.2vw, 48px)/1.06 var(--font-display); letter-spacing: -0.035em; margin: 0 0 14px; }
  h1 .grad { background: linear-gradient(92deg, var(--accent-2), var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .lede { color: var(--muted); font-size: 16.5px; max-width: 62ch; margin: 0 0 18px; }
  .cta { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 0 20px; border-radius: 12px; border: 1px solid transparent;
    font: 650 15px/1 var(--font); cursor: pointer; text-decoration: none; transition: transform 0.15s var(--ease-out), box-shadow 0.2s, border-color 0.2s; }
  .btn.primary { color: var(--btn-ink); background: linear-gradient(135deg, var(--btn-a), var(--btn-b)); box-shadow: 0 12px 30px -12px var(--accent-2-glow), inset 0 1px 0 rgba(255, 255, 255, 0.35); }
  .btn.primary:hover { transform: translateY(-1px); box-shadow: 0 16px 36px -12px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, 0.35); }
  .btn.ghost { color: var(--ink); background: var(--panel-2); border-color: var(--line-strong); }
  .btn.ghost:hover { border-color: var(--accent); }
  .health h3 { margin-bottom: 4px; }
  .health .hsub { margin: 0 0 14px; font-size: 13px; color: var(--muted); }
  .rings { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 420px) { .rings { grid-template-columns: minmax(0, 1fr); } }
  .ring { text-align: center; }
  .ring .rv { position: relative; width: 112px; max-width: 100%; margin: 0 auto 8px; aspect-ratio: 1; }
  .ring svg { display: block; width: 100%; height: 100%; }
  .ring circle { fill: none; stroke-width: 9; }
  .ring .track { stroke: var(--track); }
  .ring .arc { stroke: var(--rc, var(--accent-2)); stroke-linecap: round; animation: sweep 1.2s var(--ease-out) both; filter: drop-shadow(0 0 6px var(--rg, var(--accent-2-glow))); }
  @keyframes sweep { from { stroke-dasharray: 0 400; } }
  .ring .rc { position: absolute; inset: 0; display: grid; place-content: center; line-height: 1.1; }
  .ring .rc b { font: 750 24px/1 var(--font-display); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .ring .rc span { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .ring .rl b { display: block; font-size: 13.5px; }
  .ring .rl span { display: block; font-size: 12px; color: var(--muted); line-height: 1.35; }
  .ring.good { --rc: var(--allow-mark); --rg: var(--allow-glow); }
  .ring.bad { --rc: var(--deny-mark); --rg: var(--deny-glow); }

  .banner { display: flex; gap: 12px; align-items: flex-start; padding: 13px 15px; margin: 0; border-radius: 14px; font-size: 13.5px; line-height: 1.5;
    background: var(--info-bg); color: var(--info); border: 1px solid var(--info-line); }
  .banner svg { flex: none; width: 18px; height: 18px; margin-top: 1px; }
  .banner b { font-weight: 650; }
  .banner ul { margin: 6px 0 0; padding-left: 18px; }
  .banner.warn { background: var(--deny-bg); color: var(--deny); border-color: var(--deny-line); margin-top: 20px; }

  /* ---------- KPI tiles ---------- */
  .metrics { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 1100px) { .metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 560px) { .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .metric { position: relative; overflow: hidden; padding: 16px 16px 14px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); min-width: 0; }
  .metric::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--k, var(--accent)); }
  .metric::after { content: ""; position: absolute; right: -36px; top: -36px; width: 110px; height: 110px; border-radius: 50%; background: radial-gradient(closest-side, var(--k, var(--accent)), transparent); opacity: 0.13; }
  .metric .mi { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; margin-bottom: 10px; color: var(--k, var(--accent)); background: var(--hover); border: 1px solid var(--line); }
  .metric .k { font-size: 13px; font-weight: 600; color: var(--muted); }
  .metric .v { font: 750 32px/1.1 var(--font-display); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; margin: 2px 0; }
  .metric .sub { font-size: 12px; line-height: 1.4; color: var(--muted); }
  .metric .mb { height: 5px; margin-top: 10px; border-radius: 99px; background: var(--track); overflow: hidden; }
  .metric .mb i { display: block; height: 100%; border-radius: 99px; background: var(--k, var(--accent)); transform-origin: left; animation: grow 0.9s var(--ease-out) both; }
  .k-accent { --k: var(--accent); } .k-allow { --k: var(--allow-mark); } .k-deny { --k: var(--deny-mark); } .k-step { --k: var(--step-mark); } .k-teal { --k: var(--accent-2); }
  @keyframes grow { from { transform: scaleX(0); } }

  /* ---------- charts ---------- */
  .charts { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 16px; margin-top: 16px; }
  @media (max-width: 960px) { .charts { grid-template-columns: minmax(0, 1fr); } }
  .chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .chart-head h3 { margin: 0; }
  .chart-head .sub { font-size: 12.5px; color: var(--muted); }
  .bignum { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .bignum b { font: 750 40px/1 var(--font-display); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .bignum span { font-size: 13px; color: var(--muted); }
  .meter { display: flex; gap: 2px; height: 22px; border-radius: 6px; overflow: hidden; background: var(--track); }
  .meter .seg { display: block; min-width: 4px; transform-origin: left; animation: grow 0.9s var(--ease-out) both; outline-offset: 2px; }
  .meter .seg:hover, .meter .seg:focus-visible { filter: brightness(1.15); }
  .t-allow { background: var(--allow-mark); } .t-step { background: var(--step-mark); } .t-deny { background: var(--deny-mark); } .t-null { background: var(--null-mark); }
  .legend { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; }
  .legend li { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; font-size: 14px; }
  .legend .sw { width: 12px; height: 12px; border-radius: 4px; }
  .legend b { font-variant-numeric: tabular-nums; }
  .legend em { font-style: normal; font-size: 12.5px; color: var(--muted); min-width: 52px; text-align: right; font-variant-numeric: tabular-nums; }
  .note { margin: 12px 0 0; font-size: 12.5px; color: var(--muted); }

  .bars { display: grid; gap: 6px; }
  .bar-row { display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr) 64px 92px; gap: 12px; align-items: center; padding: 7px 8px; border-radius: 10px; cursor: pointer; transition: background 0.2s; }
  .bar-row:hover, .bar-row:focus-visible { background: var(--hover); }
  .bar-row:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .bar-row .bl { font: 650 14px/1.2 var(--font-display); font-variant-numeric: tabular-nums; min-width: 0; }
  .bar-row .bl small { display: block; font: 500 11.5px/1.3 var(--font); color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-row .bt { height: 12px; border-radius: 0 6px 6px 0; background: var(--track); overflow: hidden; }
  .bar-row .bt i { display: block; height: 100%; border-radius: 0 4px 4px 0; transform-origin: left; animation: grow 0.9s var(--ease-out) both; }
  .bar-row .bv { font: 600 13px/1 var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
  .bar-row .pill { justify-self: start; }
  @media (max-width: 560px) {
    .bar-row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "l p" "t v"; row-gap: 6px; }
    .bar-row .bl { grid-area: l; } .bar-row .pill { grid-area: p; justify-self: end; } .bar-row .bt { grid-area: t; } .bar-row .bv { grid-area: v; }
  }
  .cols { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 12px; align-items: end; height: 150px; margin: 14px 0 6px; padding-bottom: 2px; border-bottom: 1px solid var(--line-strong); }
  .cols .col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; }
  .cols .col b { font: 600 12px/1 var(--mono); font-variant-numeric: tabular-nums; }
  .cols .col i { display: block; width: min(44px, 80%); border-radius: 4px 4px 0 0; background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 55%, transparent));
    transform-origin: bottom; animation: rise 0.9s var(--ease-out) both; }
  .cols-x { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 12px; text-align: center; font-size: 11.5px; color: var(--muted); }
  @keyframes rise { from { transform: scaleY(0); } }

  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 999px; white-space: nowrap; font: 700 11.5px/1.1 var(--mono); letter-spacing: 0.04em; border: 1px solid transparent; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
  .pill.ALLOW { color: var(--allow); background: var(--allow-bg); border-color: var(--allow-line); }
  .pill.STEP_UP { color: var(--step); background: var(--step-bg); border-color: var(--step-line); }
  .pill.DENY, .pill.FAIL_CLOSED { color: var(--deny); background: var(--deny-bg); border-color: var(--deny-line); }
  .pill.PENDING, .pill.DELAY { color: var(--info); background: var(--info-bg); border-color: var(--info-line); }
  .pill.none { color: var(--null); background: var(--null-bg); }

  /* ---------- try the device: an ESP32 board (the same look as the live page) ---------- */
  .device { display: grid; grid-template-columns: minmax(0, 330px) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 760px) { .device { grid-template-columns: minmax(0, 1fr); } }
  .board { position: relative; padding: 18px 30px 24px; border-radius: 18px; color: #e6f2ec;
    background: radial-gradient(rgba(187, 247, 208, 0.10) 1px, transparent 1.6px) 0 0 / 14px 14px, radial-gradient(circle at 18% 0%, rgba(255, 255, 255, 0.10), transparent 45%),
                linear-gradient(160deg, #11523f 0%, #0b3a2d 55%, #072a21 100%);

  function source(s) { return s ? "<li>Source: " + esc(s) + "</li>" : ""; }
  /* Why a payment is still waiting matters more than the count. Without a
     live challenge it is settled to DENIED the next time atlas_service starts
     (resolve_stale_step_ups); only a live challenge waits on a person. */
  function awaitingNote(aw, total) {
    if (!total) return "none waiting";
    if (!aw) return "challenge status not exported";
    var settles = (aw.expired || 0) + (aw.no_challenge || 0) + (aw.consumed_not_advanced || 0);
    if (!settles) return "challenge still live · waiting on a person";
    if (aw.expired === total) return "challenge expired · denied at next service start";
    if (settles === total) return "no live challenge · denied at next service start";
    return (aw.live || 0) + " live · " + settles + " denied at next service start";
  }
  function bar(a, b) {
    if (typeof a !== "number" || typeof b !== "number" || !b) return "";
    return '<div class="bar"><i style="width:' + Math.round((a / b) * 100) + '%"></i></div>';
  }
  /* A ring for one ratio. The number in the middle is the figure; the arc only shows it. */
  function ring(value, whole, label, sub, bad) {
    var ok = typeof value === "number" && typeof whole === "number" && whole > 0;
    var c = 2 * Math.PI * 42, f = ok ? Math.max(0, Math.min(1, value / whole)) : 0;
    return '<div class="ring ' + (ok ? (bad ? "bad" : "good") : "") + '"><div class="rv"><svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">' +
      '<circle class="track" cx="50" cy="50" r="42"/>' +
      (ok ? '<circle class="arc" cx="50" cy="50" r="42" transform="rotate(-90 50 50)" stroke-dasharray="' + (f * c).toFixed(1) + " " + c.toFixed(1) + '"/>' : "") +
      '</svg><div class="rc"><b>' + (ok ? plain(value) : "n/a") + "</b><span>" + (ok ? "of " + plain(whole) : "") + "</span></div></div>" +
      '<div class="rl"><b>' + esc(label) + "</b><span>" + esc(sub) + "</span></div></div>";
  }
  /* One bar split into parts, with a legend that names every part: colour never works alone. */
  function meter(parts, whole, compact) {
    var sum = parts.reduce(function (a, p) { return a + p.value; }, 0) || 1;
    return '<div class="meter" role="img" aria-label="' + esc(parts.map(function (p) { return p.label + ": " + p.value; }).join(", ")) + '">' +
      parts.filter(function (p) { return p.value > 0; }).map(function (p) {
        return '<span class="seg t-' + p.tone + '" tabindex="0" style="flex:' + p.value + ' 1 0" data-tip="' + esc(p.label + ": " + plain(p.value) + " of " + plain(whole || sum) + " (" + share(p.value, whole || sum) + ")") + '"></span>';
      }).join("") + "</div>" +
      (compact ? "" : '<ul class="legend">' + parts.map(function (p) {
        return '<li><i class="sw t-' + p.tone + '"></i><span>' + esc(p.label) + "</span><b>" + plain(p.value) + "</b><em>" + share(p.value, whole || sum) + "</em></li>";
      }).join("") + "</ul>");
  }
  function sweepBars(list) {
    var top = Math.max.apply(null, list.map(function (r) { return typeof r.elapsed_ms === "number" ? r.elapsed_ms : 0; }).concat([1]));
    return '<div class="bars">' + list.map(function (r, i) {
      var ms = typeof r.elapsed_ms === "number" ? r.elapsed_ms : null;
      var where = esc(r.local_time) + " · " + esc(r.rail) + (r.beneficiary_is_new ? " · new payee" : "");
      return '<div class="bar-row" role="button" tabindex="0" data-row="' + i + '" data-tip="' +
        esc(r.label + ": " + String(r.final_status || "n/a").replace(/_/g, " ") + (ms === null ? "" : " in " + plain(Math.round(ms)) + " ms") + ". Click to open every layer.") + '">' +
        '<span class="bl">' + inr(r.amount) + "<small>" + where + "</small></span>" +
        '<span class="bt"><i class="t-' + tone(r.final_status) + '" style="width:' + (ms === null ? 0 : Math.max(2, ms / top * 100)).toFixed(1) + '%"></i></span>' +
        '<span class="bv">' + (ms === null ? "n/a" : plain(Math.round(ms)) + " ms") + "</span>" + pill(r.final_status) + "</div>";
    }).join("") + "</div>";
  }
  function tableRows(order) {
    return order.map(function (i) {
      var r = rows[i], p = r.policy || {}, ml = r.ml || {}, b = r.bank || {}, rp = r.replay || {};
      return '<tr data-row="' + i + '" data-status="' + esc(r.final_status) + '" tabindex="0">' +
        "<td>" + esc(r.label) + '</td><td class="num">' + inr(r.amount) + "</td><td>" + esc(r.local_time) + "</td><td>" + esc(r.rail) + "</td>" +
        "<td>" + pill(r.final_status) + "</td><td>" + (p.deciding_rule ? "<code>" + esc(p.deciding_rule) + "</code>" : "none fired") + "</td>" +
        "<td>" + esc(ml.risk_band || "n/a") + "</td><td>" + (b.contacted ? (b.approved ? "approved" : "refused") : "not contacted") + "</td>" +
        "<td>" + (rp.final_status ? (rp.refused ? "refused" : "accepted again") : "not tested") + "</td>" +
        '<td class="num">' + (typeof r.elapsed_ms === "number" ? plain(Math.round(r.elapsed_ms)) + " ms" : "n/a") + "</td></tr>";
    }).join("");
  }
})();
</script>
</body>
</html>
