[pytest]
# Collection starts at tests/ rather than the repository root. Walking the whole
# tree made pytest list the contents of the key directories looking for test
# files (2026-09-17 audit): harmless, since it reads names and not keys, but
# there is nothing to collect there.
testpaths = tests

markers =
    js: runs the dashboard page's JavaScript through node (skipped if node is absent)
    firmware: builds or inspects the ESP32 sketch (the build needs arduino-cli and
        ATLAS_FIRMWARE_BUILD=1, because it takes about a minute)
    browser: drives the dashboard in real browser engines through Playwright (skipped,
        with the reason, where Playwright or an engine is unavailable)
