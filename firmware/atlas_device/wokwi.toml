# Wokwi project config -- read ONLY by the Wokwi VS Code extension.
#
# READ THIS FIRST IF YOU GOT "firmware binary ... not found in workspace":
# that error does not mean this file is wrong. It means the sketch has not
# been compiled yet. The Wokwi VS Code extension does NOT compile Arduino
# code -- it only simulates a binary some other toolchain already built
# ("you need to compile the code and generate the firmware / ELF file",
# Wokwi's own getting-started docs). Nothing in this repository builds it
# for you, by design: the ESP32 toolchain is a large install and is not
# assumed to be present.
#
# So you have two options, both documented step-by-step in ../README.md:
#
#   1. wokwi.com web IDE  -- ZERO local install, compiles server-side, and
#      ignores this file completely. Recommended for a first run.
#   2. VS Code extension  -- needs arduino-cli + the ESP32 core +
#      ArduinoJson 7.x installed locally, then one compile command. Only
#      after that does this file resolve to anything.
#
# The exact command that produces the two paths below (run it from this
# directory -- see ../README.md for the one-time setup that precedes it):
#
#   arduino-cli compile --fqbn esp32:esp32:esp32doit-devkit-v1 \
#       --output-dir build .
#
# The paths are relative to this directory and use forward slashes on every
# platform, including Windows, per Wokwi's project-config docs.

[wokwi]
version = 1
firmware = "build/atlas_device.ino.bin"
elf = "build/atlas_device.ino.elf"

# If the plain .bin ever misbehaves on ESP32, arduino-cli also emits
# build/atlas_device.ino.merged.bin (bootloader + partition table +
# application in one image). Wokwi recommends a merged image for custom
# firmware, so switching `firmware` to that file is the first thing to try.
# Unverified either way -- neither variant has been built or simulated by
# the environment that wrote this file.

# --- networking: reach atlas_service on this machine, with no tunnel --------
#
# The simulated ESP32 has no route to the host by default. Pointing it at a
# public tunnel worked but was fragile and unsafe: the URL changed on every
# restart, free providers rate-limited it, and while it ran ATLAS was exposed
# to the internet with no authentication at all.
#
# This is the replacement. wokwigw (the Wokwi private IoT gateway) runs on
# THIS machine and listens on :9011. Its config.go declares a DNS zone
# "wokwi.internal." with host -> 10.13.37.254, and NAT{10.13.37.254 ->
# 127.0.0.1}. So the firmware's http://host.wokwi.internal:8000 lands on
# 127.0.0.1:8000 here.
#
# What that buys, and why it is the long-term answer:
#   * atlas_service STAYS BOUND TO 127.0.0.1 -- no 0.0.0.0, no LAN bind
#   * nothing is exposed to the internet, so there is nothing to secure
#   * no URL to regenerate, no subdomain to lose, no provider to rate-limit
#   * survives a Wi-Fi change or a new DHCP lease -- no IP is hardcoded
#
# Requires wokwigw running. Start it before the simulation; see ../README.md.
[net]
gateway = "ws://localhost:9011"

# --- the SIMULATED GNSS receiver (2026-10-09) --------------------------------
#
# A Wokwi custom chip wired to UART2 in diagram.json: it writes NMEA sentences the
# way a multi-GNSS receiver does, from scripted positions. It receives no satellite.
# Its "scenario" slider (0 home, 1 outside home, 2 impossible travel, 3 no fix,
# 4 silent, 5 poor accuracy, 6 bad NMEA) changes what it says while the simulation runs.
#
# The .wasm is BUILT, not tracked: .github/workflows/device-build.yml compiles
# chips/atlas-gnss.chip.c on GitHub's Linux machines and uploads it as the artifact
# "atlas-gnss-chip"; put its atlas-gnss.chip.wasm here (check it first with
# python scripts/wasm_exports.py chips/atlas-gnss.chip.wasm chipInit). Wokwi refuses
# to start while the file is missing -- see ../README.md.
[[chip]]
name = "atlas-gnss"
binary = "chips/atlas-gnss.chip.wasm"
